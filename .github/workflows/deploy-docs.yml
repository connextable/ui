name: Deploy documentation

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: connextable-ui-docs
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      artifact-id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - name: Build and package documentation for Pages
        env:
          NITRO_PRESET: cloudflare_pages
        run: |
          pnpm build
          test -s apps/docs/dist/_worker.js/index.js
          tar -czf "$RUNNER_TEMP/connextable-docs.tar.gz" -C apps/docs dist
      - id: bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/connextable-docs.tar.gz
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: docs-production
      url: https://ui.connextable.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}
      - run: tar -xzf "$RUNNER_TEMP/connextable-docs.tar.gz" -C apps/docs
      - name: Deploy the verified Pages artifact
        working-directory: apps/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          projects_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID:?Set CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          authorization="Authorization: Bearer ${CLOUDFLARE_API_TOKEN:?Set CLOUDFLARE_API_TOKEN}"
          project=$(curl --silent --show-error --max-time 30 -H "$authorization" "$projects_url/connextable-ui")
          if jq -e '.success == false and any(.errors[]?; .code == 8000007)' >/dev/null <<< "$project"; then
            curl --silent --show-error --fail --max-time 30 -H "$authorization" -H 'Content-Type: application/json' \
              --data '{"name":"connextable-ui","production_branch":"main"}' "$projects_url" |
              jq -e '.success and .result.production_branch == "main"' >/dev/null
          elif ! jq -e '.success and .result.production_branch == "main"' >/dev/null <<< "$project"; then
            echo 'Unable to verify the connextable-ui Pages project and its main production branch.' >&2
            exit 1
          fi
          npx --yes wrangler@4.166.0 pages deploy dist --branch main
