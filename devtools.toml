profile = "connextable-ui"

[tools]
node = { version = "26.x" }
pnpm = { version = "12" }

[defaults]
tools = ["node", "pnpm"]

[ports.docs]
port = 14600
range = [14600, 14699]

[commands."install:workspace"]
exec = ["pnpm", "install", "--frozen-lockfile"]

[commands."build:workspace"]
exec = ["pnpm", "build"]

[commands."typecheck:workspace"]
exec = ["pnpm", "typecheck"]

[commands."dev:docs"]
exec = [
  "sh", "-c",
  'pnpm --filter @connextable/ui build && cd apps/docs && exec ./node_modules/.bin/nuxt dev "$@"',
  "dev:docs", "--host", "127.0.0.1", "--port", "${bind.DOCS_PORT}", "--strictPort",
]
serve = ["docs"]

[commands."dev:docs".bind]
DOCS_PORT = { port = "docs" }
DOCS_URL = { template = "http://127.0.0.1:${bind.DOCS_PORT}" }

[commands."dev:docs".ready]
exec = ["node", "scripts/check-docs.ts"]
timeout = "3s"

[commands."check:docs-references"]
exec = ["node", "scripts/check-catalog-references.ts"]

[commands."check:docs-references".bind]
DOCS_PORT = { port = "docs" }
DOCS_URL = { template = "http://127.0.0.1:${bind.DOCS_PORT}" }
